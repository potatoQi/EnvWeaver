[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envweaver"
version = "0.1.0"
description = "Composable infrastructure for agent-authored task production pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
guest = ["jupyter-client>=8,<9", "ipykernel>=6,<8", "pillow>=10"]
desktop = ["pyautogui>=0.9.54", "pyperclip>=1.9"]

[project.scripts]
envweaver-guest = "envweaver.guest:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2", "jupyter-client>=8,<9", "ipykernel>=6,<8", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly enabled external runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
