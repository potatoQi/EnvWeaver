[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envweaver"
version = "0.0.2"
description = "Unified infrastructure for agent tasks, environments, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13,<15",
    "pillow>=10",
    "jsonschema>=4,<5",
]

[project.urls]
Documentation = "https://potatoqi.github.io/EnvWeaver/"

[project.optional-dependencies]
management = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
desktop = [
    "vncdotool>=1.3,<2",
]

[dependency-groups]
management-test = ["httpx>=0.27,<1", "playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]
# mkdocstrings 0.x uses the pymdown-extensions 10.x highlighting API.
docs = [
    "mike>=2,<3",
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.29,<1",
    "pymdown-extensions>=10,<11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly enabled external runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
# Twine 6.x cannot validate core metadata 2.5.
core-metadata-version = "2.4"
# Keep local pipeline checkouts and generated data out of published archives.
only-include = [
    "src/envweaver", "web", "tests", "docs", "scripts",
    "README.md", "pyproject.toml", "uv.lock", "mkdocs.yml", "AGENTS.md",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"web" = "envweaver/management/web"
