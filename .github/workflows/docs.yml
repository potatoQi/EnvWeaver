name: Documentation

on:
  push:
    branches-ignore: [gh-pages]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked --only-group docs
      - run: uv run --only-group docs mkdocs build --strict
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"

  archive:
    needs: build
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: documentation-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked --only-group docs
      - name: Archive documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run --only-group docs mike deploy --push --update-aliases "$(uv version --short)" latest
            uv run --only-group docs mike set-default --push latest
          else
            uv run --only-group docs mike deploy --push dev
          fi

  deploy:
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Identify documentation archive
        id: archive
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: .
      - uses: actions/github-script@v7
        id: deployment
        env:
          DOCS_ARCHIVE_SHA: ${{ steps.archive.outputs.sha }}
          DOCS_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            // Pages identifies deployments by build version. Source commits can
            // be shared by main and a tag, so identify the archived docs instead.
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            core.info(`Deploying documentation archive ${process.env.DOCS_ARCHIVE_SHA}`);
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: Number(process.env.DOCS_ARTIFACT_ID),
                pages_build_version: process.env.DOCS_ARCHIVE_SHA,
                oidc_token: oidcToken,
              }
            );
            const params = { ...context.repo, pages_deployment_id: deployment.id };
            const failures = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost',
            ]);
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', params
              );
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failures.has(data.status)) throw new Error(`Pages: ${data.status}`);
            }
            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', params
            );
            throw new Error('Pages deployment timed out');
