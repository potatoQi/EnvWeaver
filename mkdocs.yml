site_name: EnvWeaver
site_description: Agent 编写任务生产 Pipeline 的 Python 基础设施
theme:
  name: mkdocs
  custom_dir: docs/overrides
  search_index_only: true
  locale: zh_CN
  hljs_style: vs
  color_mode: auto
  user_color_mode_toggle: true
extra_css:
  - stylesheets/white.css
extra_javascript:
  - javascripts/search.js
extra:
  docs_version: !ENV [MIKE_DOCS_VERSION, '']
nav:
  - 项目简介: index.md
  - Runtime: runtime.md
  - Verifier: verifier.md
  - Task: task.md
exclude_docs: |
  design.md
  overrides/
plugins:
  - search
  - mike:
      version_selector: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3
            separate_signature: true
            show_signature_annotations: false
            show_root_full_path: false
            show_labels: false
            docstring_section_style: table
            members_order: source
markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - toc:
      permalink: true
      toc_depth: "2"
watch:
  - src/envweaver
validation:
  links:
    not_found: warn
    anchors: warn
