site_name: EnvWeaver
site_description: Agent 编写任务生产 Pipeline 的 Python 基础设施
theme:
  name: mkdocs
  locale: zh_CN
nav:
  - 接口用法: index.md
exclude_docs: |
  usage.md
  extending.md
  design.md
  contributing.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 4
            separate_signature: true
            show_signature_annotations: false
            show_root_full_path: false
            show_labels: false
            docstring_section_style: list
            members_order: source
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
      toc_depth: "2-3"
watch:
  - src/envweaver
validation:
  links:
    not_found: warn
    anchors: warn
